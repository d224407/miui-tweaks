name: Build

on:
  push:
    branches: [ '**' ]
  workflow_dispatch:

permissions:
  contents: write

# main runs queue up one after another so two pushes can't bump to the same
# version; any other branch just cancels its own older run.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      CFLAGS: "-Oz -flto -ffunction-sections -fdata-sections -fno-unwind-tables -fno-asynchronous-unwind-tables -Wl,--gc-sections -s"
      # Every branch builds. Only main bumps the version and publishes.
      IS_MAIN: ${{ github.ref == 'refs/heads/main' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r29

      # main: bump version/versionCode in module.prop and name the zip after
      # the new version. Other branches: leave module.prop alone and name the
      # zip <id>-v<current>-<branch>-<sha> so it can't be mistaken for a release.
      - name: Resolve version
        id: ver
        run: |
          VERSION_RAW=$(grep "^version=" module.prop | cut -d'=' -f2)
          VERSION=${VERSION_RAW#v}
          VERSION_CODE=$(grep "^versionCode=" module.prop | cut -d'=' -f2)
          MODID="$(grep '^id=' module.prop | cut -d= -f2)"

          if [ "$IS_MAIN" = "true" ]; then
            VERSION=$((VERSION + 1))
            VERSION_CODE=$((VERSION_CODE + 1))
            sed -i "s/^version=v.*/version=v${VERSION}/" module.prop
            sed -i "s/^versionCode=.*/versionCode=${VERSION_CODE}/" module.prop
            ZIP_NAME="${MODID}-v${VERSION}.zip"
          else
            BRANCH="${GITHUB_REF_NAME//[^A-Za-z0-9._-]/-}"
            ZIP_NAME="${MODID}-v${VERSION}-${BRANCH}-${GITHUB_SHA::7}.zip"
          fi

          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "version_code=${VERSION_CODE}" >> $GITHUB_OUTPUT
          echo "zip_name=${ZIP_NAME}" >> $GITHUB_OUTPUT

      # update.json follows the bump: the release link is built from the new
      # tag + zip name every run, so it never points at an old release.
      - name: Update update.json
        if: env.IS_MAIN == 'true'
        run: |
          TAG="v${{ steps.ver.outputs.version }}"
          CODE="${{ steps.ver.outputs.version_code }}"
          ZIP_NAME="${{ steps.ver.outputs.zip_name }}"
          URL="https://github.com/${{ github.repository }}/releases/download/${TAG}/${ZIP_NAME}"
          printf '{\n  "version": "%s",\n  "versionCode": %s,\n  "zipUrl": "%s"\n}\n' "$TAG" "$CODE" "$URL" > update.json
          cat update.json

      # Compiles every source file under src/ - adding a new .c file there
      # is enough to ship a new tool, nothing here needs editing for that.
      - name: Compile every src/*.c for every ABI
        run: |
          NDK=${{ steps.setup-ndk.outputs.ndk-path }}
          declare -A CLANG
          CLANG["32"]="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi21-clang"
          CLANG["64"]="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang"
          CLANG["x86"]="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/i686-linux-android21-clang"
          CLANG["x64"]="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android21-clang"
          STRIP="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip"

          mkdir -p system/bin
          SRC_COUNT=0
          for src in src/*.c; do
            [ -f "$src" ] || continue
            name="$(basename "$src" .c)"
            SRC_COUNT=$((SRC_COUNT + 1))
            for suffix in "${!CLANG[@]}"; do
              "${CLANG[$suffix]}" $CFLAGS -o "system/bin/${name}_${suffix}" "$src"
              "$STRIP" --strip-all "system/bin/${name}_${suffix}"
            done
            echo "Compiled $name for ${!CLANG[@]}"
          done
          if [ "$SRC_COUNT" -eq 0 ]; then
            echo "No source files found under src/!"
            exit 1
          fi
          chmod 755 system/bin/*

      - name: Package module zip
        run: |
          # Everything in the repo goes into the module except the
          # repo-only src/ and .github/ dirs.
          zip -r9 "${{ steps.ver.outputs.zip_name }}" . -x "src/*" ".github/*" ".git/*" ".gitattribute" "update.json"

      - name: Commit version bump
        if: env.IS_MAIN == 'true'
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add module.prop update.json
          git commit -m "chore: bump version to v${{ steps.ver.outputs.version }} [skip ci]" || echo "No changes to commit"
          git push origin HEAD:main

      - name: Create Release
        if: env.IS_MAIN == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: v${{ steps.ver.outputs.version }}
          draft: false
          prerelease: false
          files: |
            ${{ steps.ver.outputs.zip_name }}
            update.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: miui-tweaks-build
          path: ${{ steps.ver.outputs.zip_name }}
