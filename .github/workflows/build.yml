name: Build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      CFLAGS: "-Oz -flto -ffunction-sections -fdata-sections -fno-unwind-tables -fno-asynchronous-unwind-tables -Wl,--gc-sections -s"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r29

      - name: Bump version
        id: bump_version
        run: |
          VERSION_RAW=$(grep "^version=" module.prop | cut -d'=' -f2)
          VERSION=${VERSION_RAW#v}
          VERSION_CODE=$(grep "^versionCode=" module.prop | cut -d'=' -f2)

          NEW_VERSION=$((VERSION + 1))
          NEW_VERSION_CODE=$((VERSION_CODE + 1))

          sed -i "s/^version=v.*/version=v${NEW_VERSION}/" module.prop
          sed -i "s/^versionCode=.*/versionCode=${NEW_VERSION_CODE}/" module.prop

          echo "new_version=${NEW_VERSION}" >> $GITHUB_OUTPUT
          echo "new_version_code=${NEW_VERSION_CODE}" >> $GITHUB_OUTPUT

      # update.json follows the bump: the release link is built from the new
      # tag + zip name every run, so it never points at an old release.
      - name: Update update.json
        run: |
          TAG="v${{ steps.bump_version.outputs.new_version }}"
          CODE="${{ steps.bump_version.outputs.new_version_code }}"
          MODID="$(grep '^id=' module.prop | cut -d= -f2)"
          ZIP_NAME="${MODID}-${TAG}.zip"
          URL="https://github.com/${{ github.repository }}/releases/download/${TAG}/${ZIP_NAME}"
          printf '{\n  "version": "%s",\n  "versionCode": %s,\n  "zipUrl": "%s"\n}\n' "$TAG" "$CODE" "$URL" > update.json
          cat update.json

      # Compiles every source file under src/ - adding a new .c file there
      # is enough to ship a new tool, nothing here needs editing for that.
      - name: Compile every src/*.c for every ABI
        run: |
          NDK=${{ steps.setup-ndk.outputs.ndk-path }}
          declare -A CLANG
          CLANG["32"]="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi21-clang"
          CLANG["64"]="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang"
          CLANG["x86"]="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/i686-linux-android21-clang"
          CLANG["x64"]="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android21-clang"
          STRIP="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip"

          mkdir -p system/bin
          SRC_COUNT=0
          for src in src/*.c; do
            [ -f "$src" ] || continue
            name="$(basename "$src" .c)"
            SRC_COUNT=$((SRC_COUNT + 1))
            for suffix in "${!CLANG[@]}"; do
              "${CLANG[$suffix]}" $CFLAGS -o "system/bin/${name}_${suffix}" "$src"
              "$STRIP" --strip-all "system/bin/${name}_${suffix}"
            done
            echo "Compiled $name for ${!CLANG[@]}"
          done
          if [ "$SRC_COUNT" -eq 0 ]; then
            echo "No source files found under src/!"
            exit 1
          fi
          chmod 755 system/bin/*

      - name: Package module zip
        id: package
        run: |
          NEW_VERSION="${{ steps.bump_version.outputs.new_version }}"
          MODID="$(grep '^id=' module.prop | cut -d= -f2)"
          ZIP_NAME="${MODID}-v${NEW_VERSION}.zip"
          echo "zip_name=${ZIP_NAME}" >> $GITHUB_OUTPUT

          # Everything in the repo goes into the module except the
          # repo-only src/ and .github/ dirs.
          zip -r9 "$ZIP_NAME" . -x "src/*" ".github/*" ".git/*" ".gitattribute" "update.json"

      - name: Commit version bump
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add module.prop update.json
          git commit -m "chore: bump version to v${{ steps.bump_version.outputs.new_version }} [skip ci]" || echo "No changes to commit"
          git push origin HEAD:${{ github.event.repository.default_branch }}

      - name: Create Release
        if: github.ref_name == github.event.repository.default_branch
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.bump_version.outputs.new_version }}
          name: v${{ steps.bump_version.outputs.new_version }}
          draft: false
          prerelease: false
          files: |
            ${{ steps.package.outputs.zip_name }}
            update.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: miui-tweaks-build
          path: ${{ steps.package.outputs.zip_name }}
