# 1=on 0=off. Edited by the WebUI.

MIUI_SERVICES=1
MISC_KILL_SERVICES=0

SYS_LOG_PROPS=1
SYS_DALVIK_PROPS=1

# risky: battery/heat/hardware-specific
CPU_PIN=0
CPU_CORE_HARDCODE=0
FIXED_PERF_MODE=0
THERMAL_OVERRIDE=0

PACKAGES_DEXOPT=0
CMD_MISC=1

LMK_PROPS=1
TOMBSTONE_DISABLE=0
BLUR_DISABLE=0

# GMS_MASTER gates the DISABLE_* categories below; GMS_LOG_DISABLE and
# DISABLE_DROIDGUARD are independent switches, not part of that bulk set.
GMS_MASTER=1
GMS_LOG_DISABLE=1
# breaks SafetyNet/Play Integrity (banking, Wallet, Play Store)
DISABLE_DROIDGUARD=0
DISABLE_ADS=1
DISABLE_TRACKING=1
DISABLE_ANALYTICS=1
DISABLE_REPORTING=1
DISABLE_BACKGROUND=0
DISABLE_UPDATE=0
DISABLE_LOCATION=0
DISABLE_GEOFENCE=0
DISABLE_NEARBY=0
DISABLE_CAST=0
DISABLE_DISCOVERY=0
DISABLE_SYNC=0
DISABLE_CLOUD=0
DISABLE_AUTH=0
DISABLE_WALLET=0
DISABLE_PAYMENT=0
DISABLE_WEAR=0
DISABLE_FITNESS=0

# WIFI_QCOM_FIX gates the WIFI_KEY_* list below. Qualcomm only, needs reboot.
WIFI_QCOM_FIX=0
WIFI_BAND_CAPABILITY=0
WIFI_KEY_ARP=1
WIFI_KEY_NS=1
WIFI_KEY_MCADDR=1
WIFI_KEY_POWERSAVE=1
WIFI_KEY_RUNTIMEPM=1
WIFI_KEY_ROAM=1
WIFI_KEY_11D=1
WIFI_KEY_RTS=1
WIFI_KEY_SCANTIME=1
WIFI_KEY_SESSIONS=1
WIFI_KEY_WAKELOCK=1

# SYSBIN_MASTER gates the STUB_* list below. Mount overlay, needs reboot.
# STUB_LOG/STUB_DEBUG/STUB_BUGREPORT can break logcat/crash handling/bug reports.
SYSBIN_MASTER=0
STUB_LOG=0
STUB_TRACED=0
STUB_DEBUG=0
STUB_BUGREPORT=0
STUB_NETDIAG=0

LEGACY_MODE=0
