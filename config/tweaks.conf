##############################################################################
# MIUI Tweaks - configuration
#
# 1 = tweak runs, 0 = tweak is skipped.
# Edit here or via the WebUI. Takes effect after reboot or "Apply now".
##############################################################################

##############################################################################
# MIUI - background services
##############################################################################
# Disable MIUI analytics/ads/GameBooster daemons.
MIUI_SERVICES=1
# Kill logging/diagnostic daemons at runtime. May respawn via watchdog.
MISC_KILL_SERVICES=0

##############################################################################
# MIUI - system properties
##############################################################################
# Turn off verbose debug/trace logging.
SYS_LOG_PROPS=1
# ART/Dalvik tuning (JIT stays on).
SYS_DALVIK_PROPS=1

##############################################################################
# MIUI - CPU / scheduling (higher risk: battery drain, heat, or wrong on
# some hardware - all default OFF)
##############################################################################
# Pin core processes to performance cores. Costs battery/heat.
CPU_PIN=0
# Hard-codes an 8-core layout. Wrong on other chips.
CPU_CORE_HARDCODE=0
# Locks CPU/GPU clocks. For short benchmarks only.
FIXED_PERF_MODE=0
# Disables overheat throttling protection. Highest risk.
THERMAL_OVERRIDE=0

##############################################################################
# MIUI - misc
##############################################################################
# Recompile every installed app. One-time cost.
PACKAGES_DEXOPT=0
# Minor cmd tweaks (ANR debug, netstats, fstrim, dropbox rate).
CMD_MISC=1

##############################################################################
# Shared (used by both the MIUI and GMS side of the original modules)
##############################################################################
# Turn off Low Memory Killer debug/stat logging.
LMK_PROPS=1
# Stop saving native crash tombstones.
TOMBSTONE_DISABLE=0
# Turn off UI blur effects.
BLUR_DISABLE=0

##############################################################################
# GMS - service categories (component list in gmslist.txt)
##############################################################################
# GMS_LOG_DISABLE: GMS's own logging/telemetry Settings.Global flags
# (clearcut, phenotype, analytics, usage stats). Distinct from
# SYS_LOG_PROPS above - this is GMS-specific, applied via `settings put`.
GMS_LOG_DISABLE=1
# Each DISABLE_* controls one GMS category. Core/essential components are never touched.
DISABLE_ADS=1
DISABLE_TRACKING=1
DISABLE_ANALYTICS=1
DISABLE_REPORTING=1
DISABLE_BACKGROUND=0
DISABLE_UPDATE=0
DISABLE_LOCATION=0
DISABLE_GEOFENCE=0
DISABLE_NEARBY=0
DISABLE_CAST=0
DISABLE_DISCOVERY=0
DISABLE_SYNC=0
DISABLE_CLOUD=0
DISABLE_AUTH=0
DISABLE_WALLET=0
DISABLE_PAYMENT=0
DISABLE_WEAR=0
DISABLE_FITNESS=0

##############################################################################
# Wi-Fi (Qualcomm only)
##############################################################################
# Patch WCNSS_qcom_cfg.ini to reduce qcom_rx_wakelock wakeups. Needs reboot.
WIFI_QCOM_FIX=0
# 0=auto (both bands), 1=force 2.4GHz only, 2=force 5GHz only. Only used
# when WIFI_QCOM_FIX=1. Needs reboot after WIFI_QCOM_FIX is on.
WIFI_BAND_CAPABILITY=0

##############################################################################
# Legacy (GhostGMS Legacy 1.3/2.0 deep tweak set)
##############################################################################
# LEGACY_MODE: ~78 additional sysprops from GhostGMS's separate "Legacy"
# module (mostly more logging/debug disables, plus a few feature toggles
# like BT AAC codec off, GPU composition mode, sleep mode). Off by default -
# larger surface than the tweaks above and less tested across devices.
# persist.ims.disabled (breaks VoLTE/VoWiFi) and wifi.interface=wlan0
# (known to bootloop some ROMs per the source module itself) are excluded.
LEGACY_MODE=0
