<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>MIUI Tweaks</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="top-bar">
  <div class="eyebrow">Root Module</div>
  <h1>MIUI Tweaks</h1>
</div>

<div class="content">
  <div class="banner">Toggling a switch applies that tweak immediately. Press "Apply now" to re-run everything, or reboot the device.</div>

  <div class="stat-card">
    <span class="label">Enabled</span>
    <span class="value" id="enabledCount">0</span>
  </div>

  <div class="search-bar">
    <svg width="20" height="20" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14z"/></svg>
    <input type="text" id="searchInput" placeholder="Search tweaks">
  </div>

  <div class="segmented">
    <button class="active" data-tab="all">All</button>
    <button data-tab="on">Enabled</button>
    <button data-tab="risky">Risky</button>
  </div>

  <div class="list-card">
    <div class="list-scroll" id="tweakList">
      <div class="state-view">
        <div class="spinner"></div>
        <div class="title">Loading</div>
      </div>
    </div>
  </div>

  <div class="action-row">
    <button class="btn" id="btnDefaults">Restore defaults</button>
    <button class="btn primary" id="btnApply">Apply now</button>
  </div>
  <div class="action-row">
    <button class="btn" id="btnLog">View log</button>
  </div>
  <pre class="logbox" id="logbox" style="display:none"></pre>
</div>

<script src="script.js"></script>
</body>
</html>
